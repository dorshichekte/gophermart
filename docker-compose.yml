services:
  postgres:
    image: postgres:16
    container_name: gophermarket_db
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - gophermarket

volumes:
  pg_data:

networks:
  gophermarket:
    driver: bridge