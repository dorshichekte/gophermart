version: "2"

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosimple
    - structcheck
    - unused
    - deadcode
    - typecheck
    - varcheck
    - ineffassign
    - gocritic
    - goimports
    - gocyclo
    - lll
    - misspell
    - goconst
    - dupl
    - depguard
    - whitespace
    - nakedret
    - forbidigo

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - migrations
  skip-files:
    - ".*\\.pb\\.go"
    - ".*_gen\\.go"

issues:
  max-issues-per-linter: 50
  max-same-issues: 0
  exclude:
    - "should have comment.*or be unexported"
    - "error return value not checked.*(Close|Write|Flush).*"

linters-settings:
  errcheck:
    exclude:
      - 'fmt.*'

  govet:
    check-shadowing: true

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  golint:
    min-confidence: 0.8

  lll:
    line-length: 120
    tab-width: 1
    ignore-comments: true
    ignore-strings: true

  forbidigo:
    forbid:
      - name: "fmt.Println"
        message: "Use logger instead of fmt.Println"
